# /etc/nginx/sites-available/acticos
# Cloudflare terminates public TLS; use "Full (strict)" with an Origin Certificate here.
# Restrict port 443 to Cloudflare IP ranges at the firewall.

upstream acticos_api { server 127.0.0.1:4000; keepalive 16; }

server {
  listen 80;
  server_name acticos.com www.acticos.com;
  return 301 https://www.acticos.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.acticos.com;

  ssl_certificate     /etc/ssl/cloudflare/acticos.pem;
  ssl_certificate_key /etc/ssl/cloudflare/acticos.key;

  # Restore real client IP from Cloudflare (add all ranges from https://www.cloudflare.com/ips/)
  real_ip_header CF-Connecting-IP;
  # set_real_ip_from 173.245.48.0/20;  ...

  root /var/www/acticos/apps/web/dist;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://acticos_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml { proxy_pass http://acticos_api; }

  # Hashed build assets: cache for a year
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # SPA fallback
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
